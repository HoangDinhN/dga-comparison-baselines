rabbitmq:
  url: "${DGA_RABBITMQ_URL:-amqp://guest:guest@localhost:5672/%2F}"
  queue_prefix: "${DGA_QUEUE_PREFIX:-dga.fanci_150}"
  heartbeat_seconds: 30
  blocked_timeout_seconds: 60
  connection_attempts: 10
  retry_delay_seconds: 2
  socket_timeout_seconds: 10
  durable: true
  queue_type: "classic"
  persistent_messages: false

artifact_server:
  bind_host: "0.0.0.0"
  port: 8080
  public_base_url: "http://192.168.101.99:8080"
  token: "${DGA_ARTIFACT_TOKEN:-replace-this-token}"

# The controller is the only machine that stores the bundle permanently.
model_artifacts:
  worker:
    bundle: "/home/machine-9/hoang/fanci_150_inference/artifact/fanci_rf_official45_150trees_bundle.joblib"

bootstrap:
  required_router_clients: 1
  required_model_workers: 7
  registration_stale_seconds: 30

client:
  assignment_retry_seconds: 15

metrics:
  accuracy_enabled: true
  report_interval_seconds: 10
  output_jsonl: "./var/test_genAI/telemetrys_1M.jsonl"

results:
  enabled: true
  prefetch: 1000
  output_jsonl: "./var/test_genAI/results_1M.jsonl"


