rabbitmq:
  url: "${DGA_RABBITMQ_URL:-amqp://guest:guest@localhost:5672/%2F}"
  queue_prefix: "${DGA_QUEUE_PREFIX:-dga.fasttext_cnn_lstm_fd32}"
  heartbeat_seconds: 30
  blocked_timeout_seconds: 60
  connection_attempts: 10
  retry_delay_seconds: 2
  socket_timeout_seconds: 10
  durable: true
  queue_type: "classic"
  persistent_messages: false

client:
  # Sửa duy nhất dòng này trên từng máy: worker-01, ..., worker-07.
  id: "worker-07"
  preferred_role: "worker"
  capabilities: ["worker"]
  registration_interval_seconds: 5
  artifact_download_timeout_seconds: 300
  strict_artifacts: true
  switch_timeout_seconds: 30
  control_queue_expiry_ms: 86400000
  control_queue_max_messages: 20

workers:
  worker:
    # Giữ batch_size=32 khi so sánh công bằng với các baseline testbed trước.
    batch_size: 32
    batch_wait_ms: 5
    prefetch: 64

metrics:
  report_interval_seconds: 10

